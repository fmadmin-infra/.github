<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 160" width="1360" height="320" role="img" aria-label="Principles: never trust, always verify; secure by design; automate the repeatable; document for the engineer on call">
<rect width="680" height="160" rx="8" fill="#12141C"/>
<path d="M8 0H672A8 8 0 0 1 680 8V24H0V8A8 8 0 0 1 8 0Z" fill="#343E8D"/>
<circle cx="16" cy="12" r="4" fill="#FFFFFF" fill-opacity="0.5"/><circle cx="30" cy="12" r="4" fill="#FFFFFF" fill-opacity="0.5"/><circle cx="44" cy="12" r="4" fill="#FFFFFF" fill-opacity="0.5"/>
<text x="340" y="16" fill="#FFFFFF" font-size="10" text-anchor="middle" font-family="Consolas,Menlo,monospace">fm-it: ~/principles</text>
<g font-family="Consolas,Menlo,monospace" font-size="13" fill="#FFFFFF">
<text x="16" y="50">$ cat principles.txt</text>
<text x="16" y="76"><tspan font-weight="700">01</tspan>  Never trust, always verify<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.750;1" begin="0s" dur="0.8s" fill="freeze"/></text>
<text x="16" y="98"><tspan font-weight="700">02</tspan>  Secure by design, not by patch<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.857;1" begin="0s" dur="1.4s" fill="freeze"/></text>
<text x="16" y="120"><tspan font-weight="700">03</tspan>  Automate the repeatable<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.900;1" begin="0s" dur="2.0s" fill="freeze"/></text>
<text x="16" y="142"><tspan font-weight="700">04</tspan>  Document for the engineer on call at 2 a.m.<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.923;1" begin="0s" dur="2.6s" fill="freeze"/></text>
</g>
</svg>
